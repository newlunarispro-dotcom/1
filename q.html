<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎥 Nexus Voice & Video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --panel: rgba(20, 20, 25, 0.7);
    --border: rgba(255, 255, 255, 0.1);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.5);
    --success: #10b981;
    --danger: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 30%),
      radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 30%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; padding: 20px; animation: fadeIn 0.3s ease; flex-direction: column; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ==== МЕНЮ ==== */
  #menu { align-items: center; justify-content: center; text-align: center; }
  .logo {
    font-size: 56px; font-weight: 800; letter-spacing: -2px; margin-bottom: 8px;
    background: linear-gradient(135deg, #fff, #818cf8);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px var(--accent-glow));
  }
  .subtitle { color: var(--text-muted); font-size: 14px; letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; font-weight: 600;}
  
  .glass-panel {
    background: var(--panel);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px; padding: 30px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  input[type="text"] {
    width: 100%; padding: 16px 20px; font-size: 16px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    color: #fff; border-radius: 14px; text-align: center;
    outline: none; font-family: inherit; margin-bottom: 15px;
    transition: all 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input.code { letter-spacing: 8px; font-weight: 800; font-size: 24px; text-transform: uppercase; }

  .btn {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 14px; cursor: pointer;
    font-family: inherit; transition: all 0.2s; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px var(--accent-glow); }
  .btn-primary:hover { background: #4f46e5; box-shadow: 0 10px 25px var(--accent-glow); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }
  .btn-outline:hover { background: rgba(255,255,255,0.05); }

  /* ==== КОМНАТА (ZOOM STYLE) ==== */
  #room { padding: 15px; height: 100vh; }
  
  .room-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; padding: 0 5px;
  }
  .room-code {
    font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 2px;
    background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .room-code:hover { background: rgba(255,255,255,0.2); }

  .video-grid {
    flex: 1; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    align-content: start; overflow-y: auto; padding-bottom: 90px;
  }

  /* Плитка участника */
  .tile {
    background: #18181b; border-radius: 20px; position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    aspect-ratio: 16/9; border: 2px solid transparent;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .tile.speaking { border-color: var(--success); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
  
  .tile video {
    width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); display: none;
  }
  .tile.video-on video { display: block; }
  .tile.video-on .avatar-big { display: none; }

  .avatar-big {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #fff;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }
  .tile.speaking .avatar-big { transform: scale(1.05); }

  .tile-name {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; z-index: 10;
  }
  .tile-mute-icon { color: var(--danger); font-size: 14px; }

  /* Панель управления снизу */
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; padding: 12px 24px;
    background: var(--panel); backdrop-filter: blur(20px);
    border-radius: 30px; border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 100;
  }

  .btn-circle {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; border: none; cursor: pointer;
    background: rgba(255,255,255,0.1); color: #fff;
    transition: all 0.2s;
  }
  .btn-circle:hover { background: rgba(255,255,255,0.2); }
  .btn-circle.danger { background: var(--danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
  .btn-circle.active { background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  .btn-circle.muted { background: var(--danger); }

  /* ==== УТИЛИТЫ ==== */
  .hidden { display: none !important; }
  .back-btn {
    background: transparent; border: none; color: var(--text-muted);
    font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 10px; display: inline-flex; align-items: center;
  }
  .back-btn:hover { color: #fff; }

  #loading-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 12px 24px;
    border-radius: 12px; font-weight: 600; font-size: 14px;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 2000;
    box-shadow: 0 10px 20px var(--accent-glow);
    transform: translate(-50%, 20px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #audio-container { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
</div>

<div id="toast"></div>
<div id="audio-container"></div>

<!-- МЕНЮ -->
<div id="menu" class="screen active">
  <div class="logo">NEXUS</div>
  <div class="subtitle">Voice & Video</div>

  <div class="glass-panel">
    <input type="text" id="name-input" placeholder="Твоё имя" maxlength="16">
    <button class="btn btn-primary" onclick="showCreateRoom()">🚀 Создать комнату</button>
    <button class="btn btn-outline" onclick="showJoinRoom()">🔗 Войти по коду</button>
  </div>
</div>

<!-- СОЗДАНИЕ -->
<div id="create-room" class="screen">
  <div><button class="back-btn" onclick="showScreen('menu')">← Назад</button></div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div class="glass-panel">
      <h2 style="margin-bottom:20px; font-weight:800; text-align:center;">Новая комната</h2>
      <input type="text" id="room-name-input" placeholder="Название (необязательно)" maxlength="24">
      <button class="btn btn-primary" onclick="createRoom()">Создать</button>
    </div>
  </div>
</div>

<!-- ВХОД -->
<div id="join-room" class="screen">
  <div><button class="back-btn" onclick="showScreen('menu')">← Назад</button></div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div class="glass-panel">
      <h2 style="margin-bottom:20px; font-weight:800; text-align:center;">Вход по коду</h2>
      <input type="text" id="join-code-input" class="code" placeholder="XXXXXX" maxlength="6">
      <button class="btn btn-primary" onclick="joinRoom()">Войти</button>
    </div>
  </div>
</div>

<!-- КОМНАТА -->
<div id="room" class="screen">
  <div class="room-top">
    <div class="room-code" id="room-code-display" onclick="copyRoomCode()">------</div>
    <div style="color:var(--text-muted); font-size:14px; font-weight:600;">
      <span id="player-count">1</span> в сети
    </div>
  </div>

  <div class="video-grid" id="video-grid"></div>

  <div class="controls">
    <button class="btn-circle" id="mic-btn" onclick="toggleMute()" title="Микрофон">🎤</button>
    <button class="btn-circle" id="cam-btn" onclick="toggleVideo()" title="Камера">📷</button>
    <button class="btn-circle danger" onclick="leaveRoom()" title="Выйти">✕</button>
  </div>
</div>

<!-- Основная логика -->
<script>
  let myName = '';
  let myId = 'u_' + Math.random().toString(36).substr(2, 9);
  let currentRoom = null;
  let inRoom = false;
  
  let localStream = null;
  let micMuted = false;
  let camOn = false;

  const peers = new Map();
  let playersUnsub = null, signalsUnsub = null;
  let knownPlayerIds = new Set();
  let audioCtx = null, selfAnalyser = null;

  // UI Функции
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }
  function getMyName() {
    let n = document.getElementById('name-input').value.trim();
    if (!n) n = 'Гость' + Math.floor(Math.random() * 9000 + 1000);
    return n.slice(0, 16);
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Медиа
  async function initMedia() {
    if (localStream) return true;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
        video: { width: 640, height: 360 } // Запрашиваем видео
      });
      
      // По умолчанию камера выключена, микрофон включен
      localStream.getVideoTracks().forEach(t => t.enabled = false);
      camOn = false;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(localStream);
      selfAnalyser = audioCtx.createAnalyser();
      selfAnalyser.fftSize = 256;
      source.connect(selfAnalyser);

      // Создаем свою плитку
      addTile(myId, myName, localStream, true);
      return true;
    } catch (e) {
      console.warn('Микрофон/камера не доступны, пробуем только звук...', e);
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        camOn = false;
        document.getElementById('cam-btn').style.display = 'none'; // Скрываем кнопку камеры, если ее нет
        addTile(myId, myName, localStream, true);
        return true;
      } catch (e2) {
        toast('❌ Нет доступа к микрофону');
        return false;
      }
    }
  }

  function toggleMute() {
    if (!localStream) return;
    micMuted = !micMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
    
    const btn = document.getElementById('mic-btn');
    btn.classList.toggle('muted', micMuted);
    btn.textContent = micMuted ? '🔇' : '🎤';
    
    document.getElementById('mute-icon-' + myId).textContent = micMuted ? '🔇' : '';
    updateFirebaseState();
  }

  function toggleVideo() {
    if (!localStream || !localStream.getVideoTracks().length) return;
    camOn = !camOn;
    localStream.getVideoTracks().forEach(t => t.enabled = camOn);
    
    const btn = document.getElementById('cam-btn');
    btn.classList.toggle('active', camOn);
    document.getElementById('tile-' + myId).classList.toggle('video-on', camOn);
    
    updateFirebaseState();
  }

  async function updateFirebaseState() {
    if (!currentRoom) return;
    try {
      await window.fb.update(window.fb.ref(window.db, `rooms/${currentRoom}/players/${myId}`), {
        muted: micMuted, video: camOn
      });
    } catch(e) {}
  }

  // WebRTC
  function createPC(peerId) {
    const pc = new RTCPeerConnection(window.ICE_SERVERS);
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const remoteStream = new MediaStream();
    pc.ontrack = (event) => {
      event.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
      addTile(peerId, '...', remoteStream, false);
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        window.fb.push(window.fb.ref(window.db, `rooms/${currentRoom}/signals/${peerId}/ice`), {
          from: myId, candidate: event.candidate.toJSON()
        });
      }
    };
    peers.set(peerId, { pc });
    return pc;
  }

  async function createOffer(peerId) {
    try {
      const pc = createPC(peerId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await window.fb.set(window.fb.ref(window.db, `rooms/${currentRoom}/signals/${peerId}/offer`), {
        from: myId, offer: { type: offer.type, sdp: offer.sdp }
      });
    } catch (e) { console.error(e); }
  }

  async function handleSignals(signals) {
    for (const [peerId, sig] of Object.entries(signals)) {
      if (peerId === myId) continue;
      let peer = peers.get(peerId);

      if (sig.offer && sig.offer.from !== myId) {
        if (!peer) {
          peer = { pc: createPC(peerId) };
          await peer.pc.setRemoteDescription(new RTCSessionDescription(sig.offer.offer));
          const answer = await peer.pc.createAnswer();
          await peer.pc.setLocalDescription(answer);
          await window.fb.set(window.fb.ref(window.db, `rooms/${currentRoom}/signals/${peerId}/answer`), {
            from: myId, answer: { type: answer.type, sdp: answer.sdp }
          });
        }
      }

      if (sig.answer && sig.answer.from !== myId && peer) {
        if (peer.pc.signalingState !== 'stable') {
          await peer.pc.setRemoteDescription(new RTCSessionDescription(sig.answer.answer));
        }
      }

      if (sig.ice && peer) {
        for (const ice of Object.values(sig.ice)) {
          if (ice.from !== myId) {
            try { await peer.pc.addIceCandidate(new RTCIceCandidate(ice.candidate)); } catch(e) {}
          }
        }
      }
    }
  }

  // UI плитки
  function addTile(id, name, stream, isMe) {
    let tile = document.getElementById('tile-' + id);
    if (!tile) {
      tile = document.createElement('div');
      tile.id = 'tile-' + id;
      tile.className = 'tile';
      tile.innerHTML = `
        <div class="avatar-big">${isMe ? '⭐' : '👤'}</div>
        <video autoplay playsinline ${isMe ? 'muted' : ''}></video>
        <div class="tile-name">
          <span>${escapeHtml(name)} ${isMe ? '(Ты)' : ''}</span>
          <span class="tile-mute-icon" id="mute-icon-${id}"></span>
        </div>
      `;
      document.getElementById('video-grid').appendChild(tile);
    }
    
    const videoEl = tile.querySelector('video');
    videoEl.srcObject = stream;

    // Проверяем наличие видеотрека
    const hasVideo = stream.getVideoTracks().length > 0 && stream.getVideoTracks()[0].enabled;
    tile.classList.toggle('video-on', hasVideo);

    // Анализ звука для чужого потока
    if (!isMe && audioCtx) {
      try {
        const src = audioCtx.createMediaStreamSource(stream);
        const analyzer = audioCtx.createAnalyser();
        analyzer.fftSize = 256;
        src.connect(analyzer);
        const data = new Uint8Array(analyzer.frequencyBinCount);
        
        setInterval(() => {
          analyzer.getByteFrequencyData(data);
          let sum = 0; for(let i=0; i<data.length; i++) sum+=data[i];
          const avg = sum/data.length;
          // Подсветка, если громко
          if (avg > 10) tile.classList.add('speaking');
          else tile.classList.remove('speaking');
          
          // Обновляем иконку видео на лету
          if (stream.getVideoTracks().length > 0) {
             tile.classList.toggle('video-on', stream.getVideoTracks()[0].enabled);
          }
        }, 200);
      } catch(e){}
    }
  }

  function removeTile(id) {
    const t = document.getElementById('tile-' + id);
    if (t) t.remove();
  }

  // Логика комнаты
  async function showCreateRoom() { myName = getMyName(); showScreen('create-room'); }
  async function showJoinRoom() { myName = getMyName(); showScreen('join-room'); }

  async function createRoom() {
    const code = Math.random().toString(36).substr(2, 6).toUpperCase();
    myName = getMyName(); currentRoom = code;
    if (!(await initMedia())) return;

    try {
      await window.fb.set(window.fb.ref(window.db, `rooms/${code}`), { host: myId });
      await window.fb.set(window.fb.ref(window.db, `rooms/${code}/players/${myId}`), {
        name: myName, muted: false, video: false, joinedAt: Date.now()
      });
      window.fb.onDisconnect(window.fb.ref(window.db, `rooms/${code}/players/${myId}`)).remove();
      enterRoom();
    } catch (e) { toast('Ошибка Firebase'); }
  }

  async function joinRoom() {
    const code = document.getElementById('join-code-input').value.trim().toUpperCase();
    if (code.length !== 6) return toast('Код 6 символов');
    myName = getMyName(); currentRoom = code;
    if (!(await initMedia())) return;

    try {
      const snap = await window.fb.get(window.fb.ref(window.db, `rooms/${code}`));
      if (!snap.exists()) return toast('Комната не найдена');
      
      await window.fb.set(window.fb.ref(window.db, `rooms/${code}/players/${myId}`), {
        name: myName, muted: false, video: false, joinedAt: Date.now()
      });
      window.fb.onDisconnect(window.fb.ref(window.db, `rooms/${code}/players/${myId}`)).remove();
      enterRoom();
    } catch (e) { toast('Ошибка Firebase'); }
  }

  function enterRoom() {
    inRoom = true;
    showScreen('room');
    document.getElementById('room-code-display').textContent = currentRoom;
    
    const pRef = window.fb.ref(window.db, `rooms/${currentRoom}/players`);
    const sRef = window.fb.ref(window.db, `rooms/${currentRoom}/signals`);

    playersUnsub = window.fb.onValue(pRef, snap => {
      if (!snap.exists()) return;
      const players = snap.val();
      document.getElementById('player-count').textContent = Object.keys(players).length;
      
      const currentIds = new Set(Object.keys(players));
      // Кто-то зашел
      for (const id of currentIds) {
        if (id !== myId && !knownPlayerIds.has(id)) {
          knownPlayerIds.add(id);
          if (myId < id) createOffer(id);
        }
        if (id !== myId) {
           // Обновляем иконку мута у чужого
           const icon = document.getElementById('mute-icon-' + id);
           if (icon) icon.textContent = players[id].muted ? '🔇' : '';
        }
      }
      // Кто-то вышел
      for (const id of knownPlayerIds) {
        if (!currentIds.has(id)) {
          knownPlayerIds.delete(id);
          removeTile(id);
          if (peers.has(id)) { peers.get(id).pc.close(); peers.delete(id); }
        }
      }
    });

    signalsUnsub = window.fb.onValue(sRef, snap => {
      if (snap.exists()) handleSignals(snap.val());
    });
  }

  async function leaveRoom() {
    if (!currentRoom) return;
    if (playersUnsub) playersUnsub();
    if (signalsUnsub) signalsUnsub();
    
    for (const id of Array.from(peers.keys())) { peers.get(id).pc.close(); removeTile(id); }
    peers.clear(); knownPlayerIds.clear();

    try {
      await window.fb.remove(window.fb.ref(window.db, `rooms/${currentRoom}/players/${myId}`));
      const snap = await window.fb.get(window.fb.ref(window.db, `rooms/${currentRoom}/players`));
      if (!snap.exists() || Object.keys(snap.val()||{}).length === 0) {
        await window.fb.remove(window.fb.ref(window.db, `rooms/${currentRoom}`));
      }
    } catch(e){}

    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    document.getElementById('video-grid').innerHTML = '';
    currentRoom = null;
    showScreen('menu');
  }

  function copyRoomCode() {
    if (currentRoom) {
      navigator.clipboard.writeText(currentRoom);
      toast('Код скопирован: ' + currentRoom);
    }
  }

  window.addEventListener('beforeunload', () => {
    if (currentRoom) {
      window.fb.remove(window.fb.ref(window.db, `rooms/${currentRoom}/players/${myId}`));
    }
  });
</script>
</body>
</html>
