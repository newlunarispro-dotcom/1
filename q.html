<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎤 Voice Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a1a; color: #fff; min-height: 100vh;
    overflow-x: hidden; user-select: none;
  }
  .screen { display: none; min-height: 100vh; padding: 20px; }
  .screen.active { display: block; }

  #menu { text-align: center; padding-top: 40px; }
  #menu h1 {
    font-size: 42px; margin-bottom: 8px;
    background: linear-gradient(90deg, #f0a, #0af, #0f0);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    letter-spacing: 2px;
  }
  @keyframes shine { to { background-position: 200% center; } }
  #menu .sub { color: #888; margin-bottom: 35px; font-size: 13px; letter-spacing: 3px; }

  .btn {
    display: block; width: 100%; max-width: 340px; margin: 12px auto;
    padding: 16px; font-size: 17px; font-weight: bold;
    border: none; border-radius: 12px; cursor: pointer;
    font-family: inherit; letter-spacing: 1px;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #0af, #06f); color: #fff; box-shadow: 0 4px 15px rgba(0, 170, 255, 0.4); }
  .btn-success { background: linear-gradient(135deg, #0f0, #090); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4); }
  .btn-danger { background: linear-gradient(135deg, #f33, #a00); color: #fff; box-shadow: 0 4px 15px rgba(255, 50, 50, 0.4); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

  input[type="text"] {
    display: block; width: 100%; max-width: 340px; margin: 8px auto;
    padding: 14px; font-size: 16px;
    background: rgba(0,0,0,0.4); border: 1px solid #0af;
    color: #fff; border-radius: 10px; text-align: center;
    outline: none; font-family: inherit;
  }
  input.code { text-transform: uppercase; letter-spacing: 8px; font-weight: bold; font-size: 22px; }

  #room { padding-top: 15px; display: flex; flex-direction: column; min-height: 100vh; }

  .room-header {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.5); padding: 14px 18px; border-radius: 12px;
    margin-bottom: 15px; border-left: 4px solid #0af;
  }
  .room-code {
    font-size: 22px; color: #0af; font-weight: bold;
    letter-spacing: 4px; cursor: pointer;
  }
  .room-code:active { opacity: 0.6; }
  .room-info { font-size: 11px; color: #888; margin-top: 4px; }
  .room-info b { color: #0f0; }

  .mic-status {
    display: flex; justify-content: center; align-items: center;
    padding: 12px; border-radius: 12px; margin-bottom: 12px;
    font-size: 15px; font-weight: bold;
    transition: all 0.2s;
  }
  .mic-status.on { background: rgba(0, 255, 0, 0.15); color: #0f0; border: 1px solid #0f0; }
  .mic-status.off { background: rgba(255, 0, 0, 0.15); color: #f33; border: 1px solid #f33; }
  .mic-status .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: currentColor; margin-right: 10px;
    box-shadow: 0 0 12px currentColor;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .players-list {
    flex: 1; background: rgba(0,0,0,0.4); border-radius: 12px;
    padding: 12px; overflow-y: auto; margin-bottom: 12px;
    min-height: 200px;
  }

  .player-item {
    display: flex; align-items: center;
    padding: 12px 15px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05);
    border-left: 3px solid #444;
    transition: all 0.2s;
  }
  .player-item.me { border-left-color: #ff0; background: rgba(255,255,0,0.08); }
  .player-item.speaking {
    border-left-color: #0f0;
    background: rgba(0, 255, 0, 0.15);
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
  }
  .player-item .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #0af, #06f);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-right: 12px; flex-shrink: 0;
    transition: box-shadow 0.15s;
  }
  .player-item.speaking .avatar {
    box-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
  }
  .player-item .info { flex: 1; overflow: hidden; }
  .player-item .name { font-weight: bold; font-size: 15px; }
  .player-item .sub { font-size: 11px; color: #888; margin-top: 2px; }
  .player-item .status-icon { font-size: 20px; margin-left: 8px; }

  .controls {
    display: flex; gap: 10px; margin-bottom: 15px;
  }
  .controls button {
    flex: 1; padding: 16px; border-radius: 12px;
    border: none; cursor: pointer;
    font-size: 15px; font-weight: bold;
    font-family: inherit;
    transition: all 0.2s;
  }
  .controls .mute-btn {
    background: linear-gradient(135deg, #0f0, #090); color: #000;
  }
  .controls .mute-btn.muted {
    background: linear-gradient(135deg, #f33, #a00); color: #fff;
  }
  .controls .leave-btn {
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .hidden { display: none !important; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .back-btn {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 14px;
  }

  #loading-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 1000;
    color: #0af; font-size: 16px;
    transition: opacity 0.3s;
  }
  #loading-overlay.hidden { display: none; }

  .spinner {
    width: 50px; height: 50px; border: 4px solid rgba(0,170,255,0.2);
    border-top-color: #0af; border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); color: #0af;
    padding: 14px 24px; border-radius: 12px;
    font-size: 14px; z-index: 2000;
    opacity: 0; transition: opacity 0.3s;
    border: 1px solid #0af;
    box-shadow: 0 0 30px rgba(0,170,255,0.4);
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { opacity: 1; }

  #audio-container {
    position: absolute; width: 0; height: 0; overflow: hidden;
    pointer-events: none;
  }

  .warn-box {
    background: rgba(255, 200, 0, 0.1);
    border: 1px solid rgba(255, 200, 0, 0.4);
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #fa0;
    text-align: center;
  }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div>Подключение...</div>
</div>

<div id="toast"></div>
<div id="audio-container"></div>

<!-- МЕНЮ -->
<div id="menu" class="screen active">
  <h1>🎤 VOICE ROOM</h1>
  <div class="sub">ГОЛОСОВЫЕ КОМНАТЫ · P2P</div>

  <input type="text" id="name-input" placeholder="Твоё имя" maxlength="16">

  <button class="btn btn-success" onclick="showCreateRoom()">🏠 СОЗДАТЬ КОМНАТУ</button>
  <button class="btn btn-primary" onclick="showJoinRoom()">🔗 ВОЙТИ ПО КОДУ</button>

  <div style="margin-top: 30px; font-size: 11px; color: #666;">
    <div id="device-info"></div>
  </div>
</div>

<!-- СОЗДАНИЕ -->
<div id="create-room" class="screen">
  <div class="top-bar"><button class="back-btn" onclick="showScreen('menu')">← Назад</button></div>
  <h2 style="text-align:center; margin-bottom:20px;">🏠 Создать комнату</h2>
  <input type="text" id="room-name-input" placeholder="Название комнаты" maxlength="24">
  <button class="btn btn-success" onclick="createRoom()">СОЗДАТЬ</button>
</div>

<!-- ВХОД -->
<div id="join-room" class="screen">
  <div class="top-bar"><button class="back-btn" onclick="showScreen('menu')">← Назад</button></div>
  <h2 style="text-align:center; margin-bottom:20px;">🔗 Войти в комнату</h2>
  <input type="text" id="join-code-input" class="code" placeholder="КОД" maxlength="6">
  <button class="btn btn-primary" onclick="joinRoom()">ВОЙТИ</button>
</div>

<!-- КОМНАТА -->
<div id="room" class="screen">
  <div class="room-header">
    <div>
      <div class="room-code" id="room-code-display" onclick="copyRoomCode()">------</div>
      <div class="room-info">Игроков: <b id="player-count">1</b></div>
    </div>
    <div style="text-align: right; font-size: 12px; color: #888;">
      <div id="room-title">Комната</div>
    </div>
  </div>

  <div class="mic-status on" id="mic-status">
    <span class="dot"></span>
    <span id="mic-status-text">Микрофон включён</span>
  </div>

  <div class="warn-box" id="warn-box">
    ⚠️ Если больше 6-8 человек — будет лагать (P2P соединение)
  </div>

  <div class="players-list" id="players-list"></div>

  <div class="controls">
    <button class="mute-btn" id="mute-btn" onclick="toggleMute()">🎤 Говорю</button>
    <button class="leave-btn" onclick="leaveRoom()">🚪 Выйти</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, set, get, update, onValue, remove,
    onDisconnect, push, off
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBr65adGCtaBQGDaUZCNIXJVK7nqKOzHRY",
    authDomain: "bitva-ab615.firebaseapp.com",
    databaseURL: "https://bitva-ab615-default-rtdb.firebaseio.com",
    projectId: "bitva-ab615",
    storageBucket: "bitva-ab615.firebasestorage.app",
    messagingSenderId: "363914814983",
    appId: "1:363914814983:web:58d95ab4050e2cbd11aca2"
  };

  let app, db;
  try {
    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    console.log('✅ Firebase подключен');
  } catch (e) {
    console.error('❌ Firebase error:', e);
  }

  window.db = db;
  window.fb = { ref, set, get, update, onValue, remove, onDisconnect, push, off };

  const ICE_SERVERS = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };

  // Устройство
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let name = 'Устройство', os = '?';
    if (/Android/i.test(ua)) {
      os = 'Android';
      const m = ua.match(/;\s*([^)]+)\s+Build/);
      name = m ? m[1] : 'Android';
    } else if (/iPhone|iPad/i.test(ua)) { os = 'iOS'; name = 'iPhone'; }
    else if (/Windows/i.test(ua)) { os = 'Windows'; name = 'PC'; }
    else if (/Mac/i.test(ua)) { os = 'macOS'; name = 'Mac'; }
    else if (/Linux/i.test(ua)) { os = 'Linux'; name = 'Linux'; }
    return { name, os };
  }

  const deviceInfo = getDeviceInfo();
  const devEl = document.getElementById('device-info');
  if (devEl) devEl.innerHTML = `<div>${deviceInfo.name} · ${deviceInfo.os}</div>`;

  const savedName = localStorage.getItem('voice_name');
  if (savedName) document.getElementById('name-input').value = savedName;

  setTimeout(() => {
    const o = document.getElementById('loading-overlay');
    if (o) o.classList.add('hidden');
  }, 300);

  console.log('🎤 Voice Room загружен');
</script>

<script>
  // ============================================================
  //  СОСТОЯНИЕ
  // ============================================================
  let myName = '';
  let myId = 'u_' + Math.random().toString(36).substr(2, 9);
  let currentRoom = null;
  let isHost = false;
  let inRoom = false;

  // WebRTC
  let localStream = null;
  let micMuted = false;
  const peers = new Map(); // peerId -> { pc, audioEl, stream, gainNode, analyser }

  // Firebase
  let roomRef = null;
  let playersRef = null;
  let signalsRef = null;
  let roomUnsub = null;
  let playersUnsub = null;
  let signalsUnsub = null;

  // Аудио-контекст для анализа громкости
  let audioCtx = null;

  // ============================================================
  //  УТИЛИТЫ
  // ============================================================
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function getMyName() {
    const input = document.getElementById('name-input');
    let n = input ? input.value.trim() : '';
    if (!n) n = 'Гость' + Math.floor(Math.random() * 9000 + 1000);
    localStorage.setItem('voice_name', n);
    return n.slice(0, 16);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============================================================
  //  МИКРОФОН
  // ============================================================
  async function initMic() {
    if (localStream) return true;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      // Аудио-контекст для измерения громкости
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(localStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      selfAnalyser = analyser;

      console.log('🎤 Микрофон получен');
      return true;
    } catch (e) {
      console.error('❌ Ошибка микрофона:', e);
      toast('❌ Нет доступа к микрофону. Разреши в браузере.');
      return false;
    }
  }

  let selfAnalyser = null;

  function toggleMute() {
    micMuted = !micMuted;
    if (localStream) {
      localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
    }
    const btn = document.getElementById('mute-btn');
    const status = document.getElementById('mic-status');
    const statusText = document.getElementById('mic-status-text');

    if (micMuted) {
      btn.textContent = '🔇 Молчу';
      btn.classList.add('muted');
      status.className = 'mic-status off';
      statusText.textContent = 'Микрофон выключен';
    } else {
      btn.textContent = '🎤 Говорю';
      btn.classList.remove('muted');
      status.className = 'mic-status on';
      statusText.textContent = 'Микрофон включён';
    }
  }

  // ============================================================
  //  КОМНАТЫ
  // ============================================================
  function showCreateRoom() {
    myName = getMyName();
    showScreen('create-room');
  }

  function showJoinRoom() {
    myName = getMyName();
    showScreen('join-room');
  }

  async function createRoom() {
    const roomName = (document.getElementById('room-name-input').value.trim() || (myName + 'а комната')).slice(0, 24);
    const code = Math.random().toString(36).substr(2, 6).toUpperCase();

    myName = getMyName();
    isHost = true;
    currentRoom = code;

    const ok = await initMic();
    if (!ok) return;

    try {
      const roomR = window.fb.ref(window.db, `voice_rooms/${code}`);
      await window.fb.set(roomR, {
        name: roomName,
        host: myId,
        createdAt: Date.now()
      });

      const playerR = window.fb.ref(window.db, `voice_rooms/${code}/players/${myId}`);
      await window.fb.set(playerR, {
        name: myName,
        device: deviceInfo.name,
        os: deviceInfo.os,
        joinedAt: Date.now(),
        muted: false,
        speaking: false
      });
      window.fb.onDisconnect(playerR).remove();

      await enterRoom();
    } catch (e) {
      console.error(e);
      toast('Ошибка: ' + e.message);
    }
  }

  async function joinRoom() {
    const code = document.getElementById('join-code-input').value.trim().toUpperCase();
    if (code.length !== 6) { toast('Код 6 символов'); return; }

    myName = getMyName();
    isHost = false;
    currentRoom = code;

    const ok = await initMic();
    if (!ok) return;

    try {
      const roomR = window.fb.ref(window.db, `voice_rooms/${code}`);
      const snap = await window.fb.get(roomR);
      if (!snap.exists()) { toast('Комната не найдена'); return; }

      const playerR = window.fb.ref(window.db, `voice_rooms/${code}/players/${myId}`);
      await window.fb.set(playerR, {
        name: myName,
        device: deviceInfo.name,
        os: deviceInfo.os,
        joinedAt: Date.now(),
        muted: false,
        speaking: false
      });
      window.fb.onDisconnect(playerR).remove();

      await enterRoom();
    } catch (e) {
      console.error(e);
      toast('Ошибка: ' + e.message);
    }
  }

  async function enterRoom() {
    inRoom = true;
    showScreen('room');
    document.getElementById('room-code-display').textContent = currentRoom;

    roomRef = window.fb.ref(window.db, `voice_rooms/${currentRoom}`);
    playersRef = window.fb.ref(window.db, `voice_rooms/${currentRoom}/players`);
    signalsRef = window.fb.ref(window.db, `voice_rooms/${currentRoom}/signals`);

    // Следим за игроками
    playersUnsub = window.fb.onValue(playersRef, (snap) => {
      if (!snap.exists()) return;
      const players = snap.val();
      renderPlayers(players);
      handlePlayerChanges(players);
    });

    // Следим за сигналами (WebRTC offer/answer/ICE)
    signalsUnsub = window.fb.onValue(signalsRef, (snap) => {
      if (!snap.exists()) return;
      const signals = snap.val();
      handleSignals(signals);
    });

    // Обновляем свою "speaking" метку
    setInterval(updateSpeakingStatus, 200);
  }

  function renderPlayers(players) {
    const list = document.getElementById('players-list');
    list.innerHTML = '';
    const ids = Object.keys(players);
    document.getElementById('player-count').textContent = ids.length;

    ids.sort((a, b) => {
      if (a === myId) return -1;
      if (b === myId) return 1;
      return (players[a].joinedAt || 0) - (players[b].joinedAt || 0);
    });

    ids.forEach(id => {
      const p = players[id];
      const isMe = id === myId;
      const div = document.createElement('div');
      div.className = 'player-item' + (isMe ? ' me' : '');
      div.id = 'player-' + id;

      const initial = (p.name || '?')[0].toUpperCase();

      div.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="info">
          <div class="name">${isMe ? '⭐ ' : ''}${escapeHtml(p.name)}</div>
          <div class="sub">${p.device || '?'} · ${p.os || '?'}</div>
        </div>
        <div class="status-icon">${p.muted ? '🔇' : '🎤'}</div>
      `;
      list.appendChild(div);
    });
  }

  // Изменения игроков: подключение / отключение
  let knownPlayerIds = new Set();

  async function handlePlayerChanges(players) {
    const currentIds = new Set(Object.keys(players));

    // Новые игроки
    for (const id of currentIds) {
      if (id === myId) continue;
      if (!knownPlayerIds.has(id)) {
        console.log('👤 Новый игрок:', id);
        knownPlayerIds.add(id);

        // Кто создаёт offer? Тот у кого ID меньше (детерминированно)
        if (myId < id) {
          await createOffer(id);
        }
      }
    }

    // Ушедшие
    for (const id of knownPlayerIds) {
      if (!currentIds.has(id)) {
        console.log('👋 Игрок ушёл:', id);
        knownPlayerIds.delete(id);
        closePeer(id);
      }
    }
  }

  // ============================================================
  //  WEBRTC
  // ============================================================
  function createPC(peerId) {
    const pc = new RTCPeerConnection(ICE_SERVERS);

    // Добавляем свои треки
    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    // Принимаем чужие треки
    const remoteStream = new MediaStream();
    pc.ontrack = (event) => {
      event.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
      attachAudio(peerId, remoteStream);
    };

    // ICE candidates
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        window.fb.push(window.fb.ref(window.db, `voice_rooms/${currentRoom}/signals/${peerId}/ice`), {
          from: myId,
          candidate: event.candidate.toJSON(),
          ts: Date.now()
        });
      }
    };

    pc.onconnectionstatechange = () => {
      console.log(`Connection ${peerId}:`, pc.connectionState);
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        closePeer(peerId);
      }
    };

    peers.set(peerId, { pc, audioEl: null, stream: remoteStream, analyser: null });
    return pc;
  }

  async function createOffer(peerId) {
    try {
      const pc = createPC(peerId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await window.fb.set(window.fb.ref(window.db, `voice_rooms/${currentRoom}/signals/${peerId}/offer`), {
        from: myId,
        offer: { type: offer.type, sdp: offer.sdp },
        ts: Date.now()
      });
    } catch (e) {
      console.error('createOffer error:', e);
    }
  }

  async function handleSignals(signals) {
    for (const [peerId, sig] of Object.entries(signals)) {
      if (peerId === myId) continue;

      // Offer для меня
      if (sig.offer && sig.offer.from !== myId) {
        if (!peers.has(peerId)) {
          const pc = createPC(peerId);
          await pc.setRemoteDescription(new RTCSessionDescription(sig.offer.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          await window.fb.set(window.fb.ref(window.db, `voice_rooms/${currentRoom}/signals/${peerId}/answer`), {
            from: myId,
            answer: { type: answer.type, sdp: answer.sdp },
            ts: Date.now()
          });
        }
      }

      // Answer для меня
      if (sig.answer && sig.answer.from !== myId) {
        const peer = peers.get(peerId);
        if (peer && peer.pc.signalingState !== 'stable') {
          try {
            await peer.pc.setRemoteDescription(new RTCSessionDescription(sig.answer.answer));
          } catch (e) {
            console.warn('setRemoteDescription answer error:', e);
          }
        }
      }

      // ICE candidates
      if (sig.ice) {
        const peer = peers.get(peerId);
        if (peer) {
          for (const ice of Object.values(sig.ice)) {
            if (ice.from !== myId) {
              try {
                await peer.pc.addIceCandidate(new RTCIceCandidate(ice.candidate));
              } catch (e) {
                // silent
              }
            }
          }
        }
      }
    }
  }

  function attachAudio(peerId, stream) {
    const peer = peers.get(peerId);
    if (!peer) return;

    let audioEl = peer.audioEl;
    if (!audioEl) {
      audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      audioEl.playsInline = true;
      audioEl.id = 'audio-' + peerId;
      document.getElementById('audio-container').appendChild(audioEl);
      peer.audioEl = audioEl;

      // Анализатор громкости
      if (audioCtx) {
        try {
          const src = audioCtx.createMediaStreamSource(stream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          src.connect(analyser);
          peer.analyser = analyser;
        } catch (e) {}
      }
    }
    audioEl.srcObject = stream;
    audioEl.play().catch(e => console.warn('Audio play failed:', e));
  }

  function closePeer(peerId) {
    const peer = peers.get(peerId);
    if (!peer) return;
    if (peer.pc) {
      try { peer.pc.close(); } catch(e) {}
    }
    if (peer.audioEl) peer.audioEl.remove();
    peers.delete(peerId);
    // Удаляем signals
    try {
      window.fb.remove(window.fb.ref(window.db, `voice_rooms/${currentRoom}/signals/${peerId}`));
    } catch(e) {}
  }

  // ============================================================
  //  SPEAKING STATUS
  // ============================================================
  async function updateSpeakingStatus() {
    if (!inRoom) return;

    // Свой статус
    let selfSpeaking = false;
    if (selfAnalyser && !micMuted) {
      const data = new Uint8Array(selfAnalyser.frequencyBinCount);
      selfAnalyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;
      selfSpeaking = avg > 15;
    }

    // Обновляем в Firebase
    try {
      await window.fb.update(window.fb.ref(window.db, `voice_rooms/${currentRoom}/players/${myId}`), {
        muted: micMuted,
        speaking: selfSpeaking
      });
    } catch(e) {}

    // Обновляем визуально чужих
    for (const [peerId, peer] of peers) {
      if (!peer.analyser) continue;
      const data = new Uint8Array(peer.analyser.frequencyBinCount);
      peer.analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;
      const isSpeaking = avg > 15;

      const el = document.getElementById('player-' + peerId);
      if (el) {
        el.classList.toggle('speaking', isSpeaking);
      }
    }

    // Свой индикатор
    const myEl = document.getElementById('player-' + myId);
    if (myEl) myEl.classList.toggle('speaking', selfSpeaking);
  }

  // ============================================================
  //  ВЫХОД
  // ============================================================
  async function leaveRoom() {
    if (!currentRoom) return;
    inRoom = false;

    // Отписки
    if (playersUnsub) { playersUnsub(); playersUnsub = null; }
    if (signalsUnsub) { signalsUnsub(); signalsUnsub = null; }
    if (roomUnsub) { roomUnsub(); roomUnsub = null; }

    // Закрываем всех пиров
    for (const id of peers.keys()) closePeer(id);

    // Удаляем себя
    try {
      await window.fb.remove(window.fb.ref(window.db, `voice_rooms/${currentRoom}/players/${myId}`));
      // Если мы хост и больше никого нет — удаляем комнату
      const snap = await window.fb.get(window.fb.ref(window.db, `voice_rooms/${currentRoom}/players`));
      if (!snap.exists() || Object.keys(snap.val() || {}).length === 0) {
        await window.fb.remove(window.fb.ref(window.db, `voice_rooms/${currentRoom}`));
      }
    } catch (e) {}

    // Отключаем микрофон
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }

    currentRoom = null;
    knownPlayerIds.clear();
    showScreen('menu');
  }

  function copyRoomCode() {
    if (!currentRoom) return;
    navigator.clipboard.writeText(currentRoom).then(() => {
      toast('📋 Код скопирован: ' + currentRoom);
    });
  }

  // При закрытии страницы — выходим
  window.addEventListener('beforeunload', () => {
    if (currentRoom) {
      try {
        window.fb.remove(window.fb.ref(window.db, `voice_rooms/${currentRoom}/players/${myId}`));
      } catch(e) {}
    }
  });

  console.log('🎤 Voice Room готов');
</script>
