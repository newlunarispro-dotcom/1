<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕊️ GitCoop — голубятня для кода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Manrope:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0c;--bg-elevated:#121216;--bg-panel:#16161c;
  --surface:rgba(25,25,32,.72);
  --surface-border:rgba(255,215,0,.12);
  --gold:#f5c542;--gold-soft:#f7d96e;--gold-dark:#b8860b;--amber:#ffb347;
  --text-primary:#f0ede8;--text-secondary:#a8a49c;--text-muted:#6b6860;
  --danger:#e74c3c;--success:#2ecc71;--info:#3498db;--purple:#9b59b6;
  --radius:20px;--radius-sm:12px;
  --transition:.22s cubic-bezier(.25,.46,.45,.94);
  --font-main:'Inter','Manrope',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 8%,rgba(245,197,66,.05) 0,transparent 45%),
    radial-gradient(circle at 85% 92%,rgba(155,89,182,.04) 0,transparent 45%);
  color:var(--text-primary);font-family:var(--font-main);min-height:100vh;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(245,197,66,.25);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(245,197,66,.4)}
a{color:var(--gold-soft);text-decoration:none}
a:hover{text-decoration:underline}

/* ========== LAYOUT ========== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:260px;background:var(--bg-elevated);border-right:1px solid rgba(255,215,0,.08);
  padding:20px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;
  display:flex;flex-direction:column;gap:8px;
}
.main{flex:1;padding:24px 32px;min-width:0;max-width:100%}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px;border-right:none;border-bottom:1px solid rgba(255,215,0,.08)}
  .sidebar .brand{width:100%}
  .main{padding:16px}
}

/* ========== LOGO ========== */
.brand{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-weight:700;font-size:1.35rem;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,215,0,.08)}
.brand .dove{font-size:1.8rem;filter:drop-shadow(0 0 10px rgba(245,197,66,.5))}
.brand .gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand .tag{font-size:.65rem;color:var(--text-muted);font-weight:400;display:block;margin-top:2px;letter-spacing:.05em;text-transform:uppercase}

/* ========== NAV ========== */
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);
  color:var(--text-secondary);cursor:pointer;transition:all var(--transition);font-size:.9rem;font-weight:500;
  border:1px solid transparent;white-space:nowrap;
}
.nav-item:hover{background:rgba(245,197,66,.08);color:var(--gold-soft);border-color:rgba(245,197,66,.15)}
.nav-item.active{background:rgba(245,197,66,.12);color:var(--gold-soft);border-color:rgba(245,197,66,.25)}
.nav-item .icon{font-size:1.1rem;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:rgba(245,197,66,.15);color:var(--gold);padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:700}

.user-block{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,215,0,.08)}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,215,0,.12);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition)}
.user-chip:hover{border-color:rgba(245,197,66,.3);background:rgba(245,197,66,.06)}
.user-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:rgba(245,197,66,.15);flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-weight:600;font-size:.9rem;color:var(--gold-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-repo-count{font-size:.7rem;color:var(--text-muted)}

/* ========== BUTTONS ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:60px;font-weight:600;font-size:.9rem;font-family:var(--font-main);border:none;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:#0a0a0c;box-shadow:0 4px 16px rgba(245,197,66,.25)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,197,66,.4)}
.btn-outline{background:transparent;border:1.5px solid rgba(245,197,66,.35);color:var(--gold-soft)}
.btn-outline:hover{background:rgba(245,197,66,.08);border-color:var(--gold)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text-secondary);border:1px solid rgba(255,255,255,.06)}
.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--text-primary)}
.btn-danger{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.25)}
.btn-danger:hover{background:rgba(231,76,60,.25)}
.btn-sm{padding:6px 14px;font-size:.82rem}
.btn-xs{padding:4px 10px;font-size:.75rem}

/* ========== CARDS ========== */
.card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--surface-border);border-radius:var(--radius);padding:22px;transition:all var(--transition)}
.card:hover{border-color:rgba(245,197,66,.22)}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-title{font-family:'Manrope',sans-serif;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}

/* ========== REPO GRID ========== */
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.repo-card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--surface-border);border-radius:var(--radius-sm);padding:18px;cursor:pointer;transition:all var(--transition);position:relative;overflow:hidden}
.repo-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--amber),transparent);opacity:0;transition:opacity var(--transition)}
.repo-card:hover{border-color:rgba(245,197,66,.3);transform:translateY(-3px)}
.repo-card:hover::before{opacity:1}
.repo-name{font-family:'Manrope',sans-serif;font-size:1.05rem;font-weight:700;color:var(--gold-soft);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.repo-desc{font-size:.85rem;color:var(--text-secondary);margin-bottom:12px;min-height:36px;line-height:1.4}
.repo-meta{display:flex;gap:14px;font-size:.75rem;color:var(--text-muted);flex-wrap:wrap}
.repo-meta span{display:flex;align-items:center;gap:4px}
.repo-lang{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(245,197,66,.1);border-radius:20px;color:var(--gold-soft);font-size:.7rem;font-weight:600}

/* ========== FILE LIST ========== */
.file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background var(--transition);font-family:var(--font-mono);font-size:.88rem}
.file-row:hover{background:rgba(245,197,66,.05)}
.file-row:last-child{border-bottom:none}
.file-row .f-icon{font-size:1.2rem;width:24px;text-align:center;flex-shrink:0}
.file-row .f-name{flex:1;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row .f-size{color:var(--text-muted);font-size:.78rem;white-space:nowrap}
.file-row .f-actions{display:flex;gap:6px;opacity:0;transition:opacity var(--transition)}
.file-row:hover .f-actions{opacity:1}

/* ========== COMMITS ========== */
.commit{padding:14px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:12px;align-items:flex-start}
.commit:last-child{border-bottom:none}
.commit-avatar{width:32px;height:32px;border-radius:50%;background:rgba(245,197,66,.15);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.commit-body{flex:1;min-width:0}
.commit-msg{font-weight:500;font-size:.9rem;margin-bottom:3px;word-break:break-word}
.commit-meta{font-size:.75rem;color:var(--text-muted)}
.commit-hash{font-family:var(--font-mono);color:var(--gold-soft);background:rgba(245,197,66,.08);padding:1px 8px;border-radius:6px;font-size:.72rem}

/* ========== CODE VIEW ========== */
.code-view{background:#0d0d10;border:1px solid rgba(245,197,66,.1);border-radius:var(--radius-sm);padding:18px;font-family:var(--font-mono);font-size:.85rem;line-height:1.6;overflow-x:auto;white-space:pre;color:#e0ddd6}
.code-view .ln{color:#4a4a50;user-select:none;display:inline-block;width:32px;text-align:right;margin-right:12px}
.code-view .kw{color:#c586c0}.code-view .str{color:#ce9178}.code-view .num{color:#b5cea8}.code-view .com{color:#6a9955;font-style:italic}.code-view .fn{color:#dcdcaa}.code-view .tag{color:#569cd6}.code-view .attr{color:#9cdcfe}

/* ========== MODAL ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:20px}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--bg-elevated);border:1px solid rgba(245,197,66,.15);border-radius:var(--radius);padding:28px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(20px) scale(.97);transition:transform .25s cubic-bezier(.25,.46,.45,.94);position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-wide{max-width:800px}
.modal h2{font-family:'Manrope',sans-serif;font-size:1.3rem;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--text-muted);font-size:1.6rem;cursor:pointer;line-height:1;transition:color var(--transition)}
.modal-close:hover{color:var(--text-primary)}

/* ========== FORMS ========== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid rgba(245,197,66,.12);background:rgba(0,0,0,.35);color:var(--text-primary);font-family:var(--font-main);font-size:.92rem;outline:none;transition:border-color var(--transition)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.1)}
.form-group textarea{min-height:120px;resize:vertical;font-family:var(--font-mono);font-size:.85rem;line-height:1.5}
.form-group small{color:var(--text-muted);font-size:.75rem;display:block;margin-top:4px}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}

/* ========== TOAST ========== */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg-elevated);border:1px solid rgba(245,197,66,.25);border-radius:var(--radius-sm);padding:12px 18px;min-width:260px;box-shadow:0 20px 40px -10px rgba(0,0,0,.8);animation:toastIn .3s cubic-bezier(.25,.46,.45,.94);font-size:.88rem;display:flex;align-items:center;gap:10px}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ========== EMPTY ========== */
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .e-icon{font-size:3rem;margin-bottom:12px;opacity:.6}
.empty .e-title{font-size:1.05rem;color:var(--text-secondary);margin-bottom:6px;font-weight:600}
.empty .e-sub{font-size:.85rem;margin-bottom:16px}

/* ========== BREADCRUMB ========== */
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--text-secondary);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb a{color:var(--gold-soft);font-weight:500}
.breadcrumb .sep{color:var(--text-muted)}

/* ========== TABS ========== */
.tabs{display:flex;gap:4px;border-bottom:1px solid rgba(255,215,0,.1);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 18px;color:var(--text-secondary);cursor:pointer;font-size:.88rem;font-weight:500;border-bottom:2px solid transparent;transition:all var(--transition);white-space:nowrap}
.tab:hover{color:var(--gold-soft)}
.tab.active{color:var(--gold-soft);border-bottom-color:var(--gold)}

/* ========== SEARCH ========== */
.search-box{position:relative;flex:1;max-width:400px}
.search-box input{width:100%;padding:10px 16px 10px 40px;border-radius:60px;border:1px solid rgba(245,197,66,.12);background:rgba(0,0,0,.35);color:var(--text-primary);font-size:.88rem;outline:none;transition:all var(--transition)}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.1)}
.search-box .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.95rem}

/* ========== MISC ========== */
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.text-muted{color:var(--text-muted)}
.text-small{font-size:.8rem}
.divider{border:none;border-top:1px solid rgba(255,255,255,.05);margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(245,197,66,.1);color:var(--gold-soft);border:1px solid rgba(245,197,66,.15)}
.avatar-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.avatar-option{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:rgba(255,255,255,.04);border:2px solid transparent;cursor:pointer;transition:all var(--transition)}
.avatar-option:hover{background:rgba(245,197,66,.1)}
.avatar-option.selected{border-color:var(--gold);background:rgba(245,197,66,.15)}
</style>
</head>
<body>

<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="dove">🕊️</span>
      <div>
        <span class="gold">GitCoop</span>
        <span class="tag">голубятня для кода</span>
      </div>
    </div>

    <div class="nav-item active" data-nav="repos" onclick="navTo('repos')">
      <span class="icon">📦</span><span>Репозитории</span>
      <span class="badge" id="navRepoCount">0</span>
    </div>
    <div class="nav-item" data-nav="new" onclick="navTo('new')">
      <span class="icon">➕</span><span>Новый репозиторий</span>
    </div>
    <div class="nav-item" data-nav="activity" onclick="navTo('activity')">
      <span class="icon">📊</span><span>Активность</span>
    </div>
    <div class="nav-item" data-nav="users" onclick="navTo('users')">
      <span class="icon">👥</span><span>Разработчики</span>
    </div>
    <div class="nav-item" data-nav="starred" onclick="navTo('starred')">
      <span class="icon">⭐</span><span>Избранное</span>
    </div>

    <div class="user-block" id="userBlock"></div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent"></main>
</div>

<!-- ===== MODALS ===== -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('authModal')">&times;</button>
    <h2>🕊️ Вход в GitCoop</h2>
    <div class="form-group"><label>Никнейм</label><input type="text" id="authNickname" maxlength="20" placeholder="developer"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="••••••••"></div>
    <div id="authError" style="color:var(--danger);font-size:.85rem;margin-bottom:12px;display:none"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-gold" style="flex:1" id="loginBtn">Войти</button>
      <button class="btn btn-outline" style="flex:1" id="registerBtn">Регистрация</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('profileModal')">&times;</button>
    <h2>👤 Профиль</h2>
    <div class="form-group"><label>Никнейм</label><input type="text" id="profileNickname" maxlength="20"></div>
    <div class="form-group"><label>О себе</label><textarea id="profileBio" rows="3" placeholder="Full-stack голубь 🕊️"></textarea></div>
    <div class="form-group">
      <label>Аватар</label>
      <div class="avatar-picker" id="avatarPicker"></div>
      <input type="text" id="profileAvatarUrl" placeholder="https://... или эмодзи">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-gold" style="flex:1" id="saveProfileBtn">Сохранить</button>
      <button class="btn btn-danger" id="logoutBtn">Выйти</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

/* ═══ HELPERS ═══ */
const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg, type='info'){
  const c = $('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  const icons = { info:'ℹ️', success:'✅', error:'❌', gold:'🕊️' };
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}
function openModal(id){ $(id).classList.add('active'); }
function closeModal(id){ $(id).classList.remove('active'); }
function encodeKey(s){ return String(s).replace(/[.#$/[\]]/g, '_'); }
function timeAgo(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m < 1) return 'только что';
  if(m < 60) return m + ' мин назад';
  const h = Math.floor(m/60);
  if(h < 24) return h + ' ч назад';
  const d = Math.floor(h/24);
  if(d < 30) return d + ' дн назад';
  return new Date(ts).toLocaleDateString('ru-RU');
}
function formatBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(1) + ' MB';
}
function randomHash(){ return Math.random().toString(16).slice(2,9); }

/* ═══ STATE ═══ */
let fbReady = false;
const state = {
  user: JSON.parse(localStorage.getItem('gitcoop_user') || 'null'),
  passwords: JSON.parse(localStorage.getItem('gitcoop_passwords') || '{}'),
  repos: [],
  users: [],
  commits: [],
  currentRepo: null,
  currentPath: [],
  currentFile: null,
  view: 'repos'
};

function savePasswords(){
  localStorage.setItem('gitcoop_passwords', JSON.stringify(state.passwords));
}
function saveUser(){
  localStorage.setItem('gitcoop_user', JSON.stringify(state.user));
}

/* ═══ RENDER SIDEBAR ═══ */
function renderSidebar(){
  $('navRepoCount').textContent = state.repos.length;
  const block = $('userBlock');
  if(state.user){
    block.innerHTML = `
      <div class="user-chip" onclick="openProfile()">
        <div class="user-avatar">${renderAvatar(state.user.avatar)}</div>
        <div class="user-info">
          <div class="user-name">${esc(state.user.nickname)}</div>
          <div class="user-repo-count">${state.repos.filter(r => r.owner === state.user.nickname).length} репо</div>
        </div>
      </div>
    `;
  } else {
    block.innerHTML = `<button class="btn btn-gold btn-sm" style="width:100%" onclick="openModal('authModal')">🕊️ Войти</button>`;
  }
}
function renderAvatar(av){
  if(!av) return '🕊️';
  if(typeof av === 'string' && av.startsWith('http')) return `<img src="${esc(av)}" onerror="this.style.display='none';this.parentNode.textContent='🕊️'">`;
  return esc(av);
}

/* ═══ NAV ═══ */
function navTo(view){
  state.view = view;
  state.currentRepo = null;
  state.currentPath = [];
  state.currentFile = null;
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.nav === view));
  renderMain();
}

/* ═══ MAIN RENDER ═══ */
function renderMain(){
  const main = $('mainContent');
  if(state.currentFile !== null){
    renderFileView(main);
    return;
  }
  if(state.currentRepo){
    renderRepoView(main);
    return;
  }
  if(state.view === 'repos') renderReposList(main);
  else if(state.view === 'new') renderNewRepo(main);
  else if(state.view === 'activity') renderActivity(main);
  else if(state.view === 'users') renderUsers(main);
  else if(state.view === 'starred') renderStarred(main);
}

function filterRepos(q){
  q = q.toLowerCase().trim();
  const filtered = q ? state.repos.filter(r =>
    r.name.toLowerCase().includes(q) ||
    (r.description||'').toLowerCase().includes(q) ||
    r.owner.toLowerCase().includes(q)
  ) : state.repos;
  renderRepoGrid(filtered);
}

function fileIcon(name){
  if(name.endsWith('.html')) return '🌐';
  if(name.endsWith('.css')) return '🎨';
  if(name.endsWith('.js')) return '⚡';
  if(name.endsWith('.json')) return '📋';
  if(name.endsWith('.md')) return '📖';
  if(name.endsWith('.py')) return '🐍';
  if(name.endsWith('.txt')) return '📄';
  return '📄';
}
function getFilesAtPath(repo, path){
  let files = repo.files || [];
  for(const p of path){
    const folder = files.find(f => f.type === 'folder' && f.name === p);
    if(!folder) return [];
    files = folder.children || [];
  }
  return files;
}
function navigateTo(index){
  state.currentPath = state.currentPath.slice(0, index + 1);
  renderMain();
}
function switchTab(el, name){
  $$('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['files','commits','info'].forEach(t => {
    const e = $('tab-' + t);
    if(e) e.style.display = t === name ? 'block' : 'none';
  });
}

/* ═══ FILE VIEW ═══ */
function openFile(name){
  const r = state.currentRepo;
  const files = getFilesAtPath(r, state.currentPath);
  const f = files.find(x => x.name === name);
  if(!f) return;
  if(f.type === 'folder'){
    state.currentPath.push(f.name);
    renderMain();
    return;
  }
  state.currentFile = f;
  renderMain();
}
function renderFileView(main){
  const f = state.currentFile;
  const r = state.currentRepo;
  const isOwner = state.user && state.user.nickname === r.owner;
  main.innerHTML = `
    <div class="breadcrumb">
      <a onclick="navTo('repos')">📦 Репозитории</a>
      <span class="sep">/</span>
      <a onclick="closeFile()">${esc(r.name)}</a>
      ${state.currentPath.map((p,i) => `
        <span class="sep">/</span>
        <a onclick="navigateTo(${i})">${esc(p)}</a>
      `).join('')}
      <span class="sep">/</span>
      <span>${esc(f.name)}</span>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">${fileIcon(f.name)} ${esc(f.name)}</div>

          ${isOwner ? `<button class="btn btn-outline btn-sm" onclick="editFile()">✏️ Редактировать</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="closeFile()">← Назад</button>

      <div class="code-view">${highlightCode(f.content || '')}</div>
    </div>
  `;
}
function closeFile(){
  state.currentFile = null;
  renderMain();
}
function highlightCode(code){
  if(!code) return '<span class="com">// пусто</span>';
  return esc(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>')
    .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="str">$1</span>')
    .replace(/\b(const|let|var|function|return|if|else|for|while|class|new|this|import|export|from|async|await)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
}

/* ═══ EDIT / CREATE FILE ═══ */
function editFile(){
  const f = state.currentFile;
  const newContent = prompt('Редактировать ' + f.name + ':', f.content || '');
  if(newContent === null) return;
  f.content = newContent;
  state.currentRepo.updatedAt = Date.now();
  addCommit(state.currentRepo, `Обновлён ${f.name}`);
  saveRepos();
  renderMain();
  toast('Файл сохранён', 'success');
}
function uploadFile(){
  const name = prompt('Имя файла (например, index.html):');
  if(!name) return;
  const content = prompt('Содержимое файла:', '');
  if(content === null) return;
  const r = state.currentRepo;
  const files = getFilesAtPath(r, state.currentPath);
  if(files.find(f => f.name === name)){ toast('Файл уже существует', 'error'); return; }
  const newFile = { name, type: 'file', content, createdAt: Date.now() };
  files.push(newFile);
  r.updatedAt = Date.now();
  addCommit(r, `Создан файл ${name}`);
  saveRepos();
  renderMain();
  toast('Файл создан', 'success');
}
function newFolder(){
  const name = prompt('Имя папки:');
  if(!name) return;
  const r = state.currentRepo;
  const files = getFilesAtPath(r, state.currentPath);
  if(files.find(f => f.name === name)){ toast('Уже существует', 'error'); return; }
  files.push({ name, type: 'folder', children: [], createdAt: Date.now() });
  r.updatedAt = Date.now();
  addCommit(r, `Создана папка ${name}`);
  saveRepos();
  renderMain();
  toast('Папка создана', 'success');
}
function deleteFile(name){
  if(!confirm('Удалить ' + name + '?')) return;
  const r = state.currentRepo;
  const files = getFilesAtPath(r, state.currentPath);
  const idx = files.findIndex(f => f.name === name);
  if(idx >= 0) files.splice(idx, 1);
  r.updatedAt = Date.now();
  addCommit(r, `Удалён ${name}`);
  saveRepos();
  renderMain();
  toast('Удалено', 'info');
}

function createRepo(){
  const name = $('newRepoName').value.trim().replace(/\s+/g, '-').toLowerCase();
  if(!name){ toast('Введите название', 'error'); return; }
  if(state.repos.find(r => r.name === name && r.owner === state.user.nickname)){
    toast('Такое репо уже есть', 'error'); return;
  }
  const desc = $('newRepoDesc').value.trim();
  const lang = $('newRepoLang').value;
  const fileContent = $('newRepoFile').value;
  const repo = {
    id: 'repo_' + Date.now() + '_' + randomHash(),
    name, description: desc, language: lang,
    owner: state.user.nickname,
    files: [],
    stars: 0,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  if(fileContent){
    const fileName = lang === 'HTML' ? 'index.html' : lang === 'JavaScript' ? 'script.js' : lang === 'CSS' ? 'style.css' : lang === 'Python' ? 'main.py' : 'README.md';
    repo.files.push({ name: fileName, type: 'file', content: fileContent, createdAt: Date.now() });
  }
  state.repos.push(repo);
  addCommit(repo, 'Инициализация репозитория');
  saveRepos();
  toast('Репозиторий создан!', 'success');
  openRepo(repo.id);
}
function deleteRepo(id){
  if(!confirm('Удалить репозиторий навсегда?')) return;
  state.repos = state.repos.filter(r => r.id !== id);
  saveRepos();
  navTo('repos');
  toast('Репозиторий удалён', 'info');
}

/* ═══ FIREBASE SYNC ═══ */
function saveRepos(){
  if(fbReady){
    window.FB.set(window.FB.ref(window.FB.db, 'gitcoop_repos'), state.repos);
    window.FB.set(window.FB.ref(window.FB.db, 'gitcoop_commits'), state.commits.slice(0, 200));
  } else {
    localStorage.setItem('gitcoop_repos', JSON.stringify(state.repos));
    localStorage.setItem('gitcoop_commits', JSON.stringify(state.commits.slice(0, 200)));
  }
}
function addCommit(repo, message){
  const commit = {
    hash: randomHash(),
    author: state.user ? state.user.nickname : 'anon',
    avatar: state.user ? state.user.avatar : '🕊️',
    message,
    repoId: repo.id,
    repoName: repo.name,
    timestamp: Date.now()
  };
  state.commits.unshift(commit);
  if(state.commits.length > 200) state.commits.length = 200;
}

window.addEventListener('firebase-ready', () => {
  fbReady = true;
  const { db, ref, onValue } = window.FB;

  onValue(ref(db, 'gitcoop_repos'), snap => {
    const val = snap.val();
    state.repos = Array.isArray(val) ? val : Object.values(val || {});
    renderSidebar();
    if(!state.currentRepo) renderMain();
  });
  onValue(ref(db, 'gitcoop_commits'), snap => {
    const val = snap.val();
    state.commits = Array.isArray(val) ? val : Object.values(val || {});
    if(state.view === 'activity') renderMain();
  });
  onValue(ref(db, 'gitcoop_users'), snap => {
    const val = snap.val();
    state.users = Array.isArray(val) ? val : Object.values(val || {});
    if(state.view === 'users') renderMain();
  });
  onValue(ref(db, 'gitcoop_passwords'), snap => {
    const val = snap.val();
    if(val && typeof val === 'object'){
      state.passwords = val;
      localStorage.setItem('gitcoop_passwords', JSON.stringify(val));
    }
  });

  // Загружаем локальные данные если Firebase пуст
  if(!state.repos.length){
    state.repos = JSON.parse(localStorage.getItem('gitcoop_repos') || '[]');
  }
  if(!state.commits.length){
    state.commits = JSON.parse(localStorage.getItem('gitcoop_commits') || '[]');
  }
});

/* ═══ AUTH ═══ */
async function login(){
  const nick = $('authNickname').value.trim();
  const pass = $('authPassword').value;
  const err = $('authError');
  err.style.display = 'none';

  if(!nick || !pass){ err.textContent = 'Введите ник и пароль'; err.style.display = 'block'; return; }

  let user = state.users.find(u => u.nickname === nick);
  if(!user){
    // Создаём
    user = {
      nickname: nick, avatar: '🕊️', bio: '',
      createdAt: Date.now(), password: pass
    };
    state.users.push(user);
    state.passwords[nick] = pass;
    savePasswords();
    if(fbReady){
      await window.FB.set(window.FB.ref(window.FB.db, `gitcoop_users/${encodeKey(nick)}`), user);
      await window.FB.set(window.FB.ref(window.FB.db, `gitcoop_passwords/${encodeKey(nick)}`), pass);
    } else {
      localStorage.setItem('gitcoop_users', JSON.stringify(state.users));
    }
  } else {
    const storedPass = state.passwords[nick];
    if(storedPass && storedPass !== pass){ err.textContent = 'Неверный пароль'; err.style.display = 'block'; return; }
    if(!storedPass){
      state.passwords[nick] = pass;
      savePasswords();
      if(fbReady) await window.FB.set(window.FB.ref(window.FB.db, `gitcoop_passwords/${encodeKey(nick)}`), pass);
    }
  }

  state.user = { ...user };
  saveUser();
  renderSidebar();
  closeModal('authModal');
  toast(`Привет, ${nick}! 🕊️`, 'success');
}

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderMain();

  $('loginBtn').onclick = login;
  $('registerBtn').onclick = async () => {
    const nick = $('authNickname').value.trim();
    const pass = $('authPassword').value;
    const err = $('authError');
    if(!nick || !pass){ err.textContent = 'Введите ник и пароль'; err.style.display = 'block'; return; }
    if(state.users.find(u => u.nickname === nick)){ err.textContent = 'Ник занят'; err.style.display = 'block'; return; }
    $('authPassword').value = pass; // сохраняем
    await login();
  };

  $('saveProfileBtn').onclick = async () => {
    if(!state.user) return;
    const newNick = $('profileNickname').value.trim();
    const newBio = $('profileBio').value.trim();
    const newAvatar = $('profileAvatarUrl').value.trim() || state.user.avatar;
    if(!newNick){ toast('Ник не может быть пустым', 'error'); return; }
    const oldNick = state.user.nickname;

    state.user.nickname = newNick;
    state.user.bio = newBio;
    state.user.avatar = newAvatar;

    const userIdx = state.users.findIndex(u => u.nickname === oldNick);
    if(userIdx >= 0) state.users[userIdx] = { ...state.user };
    else state.users.push({ ...state.user });

    if(oldNick !== newNick && state.passwords[oldNick]){
      state.passwords[newNick] = state.passwords[oldNick];
      delete state.passwords[oldNick];
      savePasswords();
    }

    if(fbReady){
      if(oldNick !== newNick) await window.FB.remove(window.FB.ref(window.FB.db, `gitcoop_users/${encodeKey(oldNick)}`));
      await window.FB.set(window.FB.ref(window.FB.db, `gitcoop_users/${encodeKey(newNick)}`), state.user);
    } else {
      localStorage.setItem('gitcoop_users', JSON.stringify(state.users));
    }
    saveUser();
    renderSidebar();
    closeModal('profileModal');
    toast('Профиль сохранён', 'success');
  };

  $('logoutBtn').onclick = () => {
    state.user = null;
    localStorage.removeItem('gitcoop_user');
    renderSidebar();
    closeModal('profileModal');
    navTo('repos');
    toast('Вы вышли', 'info');
  };

  $$('.modal-overlay').forEach(o => o.addEventListener('click', e => {
    if(e.target === o) o.classList.remove('active');
  }));
});
</script>
</body>
