<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Info | SND Network</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --card-bg: rgba(20, 20, 30, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #0af;
    --accent-glow: rgba(0, 170, 255, 0.4);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  
  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 20px;
  }

  /* Сетка на фоне */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center center;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
  }
  
  /* Неоновые пятна */
  .bg-glow {
    position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 20% 30%, rgba(0, 170, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.1), transparent 40%);
  }

  /* Главная карточка */
  .container {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Заголовок */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 30px;
  }
  .title {
    font-size: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--success);
    background: rgba(16, 185, 129, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* IP Адрес */
  .ip-box {
    text-align: center;
    margin-bottom: 40px;
    padding: 25px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .ip-label { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }
  .ip-address {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px var(--accent-glow);
    font-family: monospace;
  }
  .ip-copy {
    position: absolute; top: 15px; right: 15px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    font-size: 12px; transition: 0.2s;
  }
  .ip-copy:hover { background: var(--accent); border-color: var(--accent); }

  /* Сетка данных */
  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 30px;
  }
  .data-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .data-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .data-value {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    word-break: break-all;
  }
  .flag-icon {
    font-size: 20px;
    margin-right: 8px;
    vertical-align: middle;
  }

  /* Карта / Координаты */
  .map-card {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(0, 170, 255, 0.1), transparent);
    border-left: 3px solid var(--accent);
  }
  .coords {
    font-family: monospace;
    font-size: 14px;
    color: var(--accent);
    margin-top: 5px;
  }

  /* Лоадер */
  .loader-container {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 300px;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    .container { padding: 25px; }
    .ip-address { font-size: 32px; }
    .data-grid { grid-template-columns: 1fr; }
    .map-card { flex-direction: column; align-items: flex-start; gap: 15px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="container" id="app">
  <!-- Экран загрузки -->
  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div style="color:var(--text-muted); font-size:14px;">Определяем данные...</div>
  </div>

  <!-- Экран с данными (скрыт по умолчанию) -->
  <div id="content" style="display: none;">
    <div class="header">
      <div class="title">Сетевой статус</div>
      <div class="status">
        <div class="status-dot"></div>
        <span>В сети</span>
      </div>
    </div>

    <div class="ip-box">
      <div class="ip-label">Твой публичный IP</div>
      <div class="ip-address" id="ip-text">0.0.0.0</div>
      <button class="ip-copy" onclick="copyIP()">Копировать</button>
    </div>

    <div class="data-grid">
      <div class="data-card">
        <div class="data-label">📍 Страна</div>
        <div class="data-value" id="country-val">-</div>
      </div>
      
      <div class="data-card">
        <div class="data-label">🏙️ Город</div>
        <div class="data-value" id="city-val">-</div>
      </div>

      <div class="data-card" style="grid-column: 1 / -1;">
        <div class="data-label">🌐 Провайдер (ISP)</div>
        <div class="data-value" id="isp-val">-</div>
      </div>

      <div class="data-card map-card">
        <div>
          <div class="data-label">🗺️ Координаты</div>
          <div class="coords" id="coords-val">0, 0</div>
        </div>
        <div style="font-size: 30px;">🛰️</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Используем бесплатный и быстрый API ipapi.co (не требует ключей)
  async function getIPInfo() {
    try {
      const response = await fetch('https://ipapi.co/json/');
      const data = await response.json();

      if (data.error) throw new Error(data.reason || 'Ошибка API');

      // Заполняем данные
      document.getElementById('ip-text').textContent = data.ip;
      
      // Флаг и страна
      const countryCode = data.country_code ? data.country_code.toLowerCase() : '';
      const countryFlag = countryCode ? `<span class="flag-icon">${getFlagEmoji(countryCode)}</span>` : '';
      document.getElementById('country-val').innerHTML = `${countryFlag} ${data.country_name || 'Неизвестно'}`;
      
      document.getElementById('city-val').textContent = data.city || 'Неизвестно';
      document.getElementById('isp-val').textContent = data.org || 'Неизвестно';
      document.getElementById('coords-val').textContent = `${data.latitude || 0}, ${data.longitude || 0}`;

      // Показываем контент
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.display = 'block';

    } catch (error) {
      console.error(error);
      document.getElementById('loader').innerHTML = `
        <div style="color: var(--danger); text-align: center;">
          <b>Ошибка загрузки данных</b><br>
          <span style="font-size:12px; color:#888;">Попробуй включить VPN или обновить страницу</span>
        </div>
      `;
    }
  }

  // Функция для превращения кода страны (RU) в эмодзи-флаг (🇷🇺)
  function getFlagEmoji(countryCode) {
    if (!countryCode) return '';
    const codePoints = countryCode
      .toUpperCase()
      .split('')
      .map(char => 127397 + char.charCodeAt(0));
    return String.fromCodePoint(...codePoints);
  }

  // Копирование IP
  function copyIP() {
    const ip = document.getElementById('ip-text').textContent;
    navigator.clipboard.writeText(ip).then(() => {
      const btn = document.querySelector('.ip-copy');
      btn.textContent = 'Скопировано!';
      btn.style.background = 'var(--success)';
      setTimeout(() => {
        btn.textContent = 'Копировать';
        btn.style.background = '';
      }, 2000);
    });
  }

  // Запускаем при загрузке
  getIPInfo();
</script>
</body>
</html>
